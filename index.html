<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音楽でつながる｜TouchMe</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#34443e;background:#f6f4ee}*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px}.wrap{max-width:560px;margin:auto}h1{text-align:center;font-size:27px;margin:28px 0 8px}p.sub{text-align:center;color:#71817a;margin:0 0 26px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #203a2d0b}h2{font-size:17px;margin:0 0 14px}.small{color:#687b71;font-size:13px;line-height:1.6}button{border:0;border-radius:13px;padding:14px 18px;font-weight:700;font-size:16px;background:#88b09e;color:#fff;cursor:pointer;width:100%}button:disabled{background:#bfc8c3}button.secondary{background:#e7efe9;color:#3b6754;margin-top:8px}.meter{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}.bar{height:20px;background:#e9eeea;border-radius:6px}.bar.on{background:#83af9b}.value{font-size:33px;font-weight:750;font-variant-numeric:tabular-nums}.status{padding:10px 12px;background:#f1f5f1;border-radius:10px;white-space:pre-wrap;word-break:break-word}.error{color:#aa433f}.question{font-size:17px;line-height:1.8}select{width:100%;padding:12px;font-size:16px;border-radius:12px;border:1px solid #d6e2d9;background:white}#log{font-size:12px;max-height:130px;overflow:auto;white-space:pre-wrap;color:#607268}
</style>
</head>
<body><main class="wrap">
<h1>🎵 音楽でつながる</h1><p class="sub">タッチコミュニケーション × 音楽回想法</p>
<section class="card"><h2>STEP 1　曲を選ぶ</h2><select aria-label="曲を選択"><option>ふるさと</option></select><p class="small">最初は「ふるさと」の7音源でテストします。</p><button id="start">① 音源を読み込んでMIDI接続</button><p id="status" class="status small">準備前：TouchMeをUSB-Cで接続してからボタンを押してください。</p></section>
<section class="card"><h2>STEP 2　触れ合って音楽を完成させる</h2><div class="value">CC90：<span id="cc">--</span></div><div id="meter" class="meter"></div><p id="stage">音源を読み込んでください</p><p class="small">TouchMeに触れると再生し、離すと一時停止します。数値が大きいほど音楽が鮮明になります。</p><button id="manual" class="secondary" disabled>音を確認する（手動再生）</button><button id="stop" class="secondary" disabled>停止・最初から</button></section>
<section class="card"><h2>STEP 3　思い出を話す</h2><div class="question">この曲を聴いて、どんな風景や出来事を思い出しましたか？</div></section>
<section class="card"><h2>受信ログ</h2><div id="log">まだ受信していません</div></section>
</main>
<script>
'use strict';
const FILES=['furusato_ambiguous_test.wav','furusato_fragments_test.wav','furusato_melody_test.wav','furusato_soft_rhythm_test.wav','furusato_between4and5_test.wav','furusato_accompaniment_test.wav','furusato_fullness_test.wav'];
const LOW=14,HIGH=40,SMOOTH=.12,RELEASE_DELAY=250;
const $=id=>document.getElementById(id);
const meter=$('meter');for(let i=0;i<7;i++){let b=document.createElement('div');b.className='bar';meter.appendChild(b)}
const bars=[...meter.children];
let ctx=null,buffers=[],sources=[],gains=[],midi=null,ready=false,playing=false,everStarted=false,manual=false,smoothed=LOW,releaseTimer=null;
function status(s,err=false){$('status').textContent=s;$('status').classList.toggle('error',err)}
function log(s){let el=$('log');el.textContent=(new Date().toLocaleTimeString()+' '+s+'\n'+(el.textContent==='まだ受信していません'?'':el.textContent)).slice(0,2200)}
const clamp=n=>Math.max(0,Math.min(1,n));
function fade(p,start,end,max){return p<=start?0:p>=end?max:(p-start)/(end-start)*max}
function vols(p){return [Math.max(.10,.70-p*.60),fade(p,.10,.40,.35),fade(p,.28,.62,.28),fade(p,.45,.75,.35),fade(p,.55,.80,.40),fade(p,.70,.95,.45),fade(p,.85,1,.40)]}
function stage(p){return p<.15?'① 曖昧':p<.30?'② 断片':p<.45?'③ 予兆':p<.58?'④ リズム':p<.72?'⑤ メロディが少し聴こえる':p<.88?'⑥ 曲が分かる':'⑦ 完成'}
function update(cc){smoothed=SMOOTH*cc+(1-SMOOTH)*smoothed;let p=clamp((smoothed-LOW)/(HIGH-LOW));$('cc').textContent=cc;$('stage').textContent=stage(p);let levels=[.15,.30,.45,.58,.72,.88,1];bars.forEach((b,i)=>b.classList.toggle('on',p>=levels[i]));let v=vols(p);gains.forEach((g,i)=>g.gain.setTargetAtTime(v[i],ctx.currentTime,.06))}
function makeSources(){sources=[];gains=[];buffers.forEach((buf,i)=>{let src=ctx.createBufferSource();src.buffer=buf;src.loop=true;let gain=ctx.createGain();gain.gain.value=0;src.connect(gain);gain.connect(ctx.destination);src.start(0);sources.push(src);gains.push(gain)});update(LOW);everStarted=true}
async function play(){if(!ready)return;clearTimeout(releaseTimer);if(!everStarted)makeSources();await ctx.resume();playing=true;status('接続OK：再生中 🎵')}
async function pause(){if(!ready||!playing)return;await ctx.suspend();playing=false;status('接続OK：一時停止中（触れると続きから再生）')}
function noteOn(){clearTimeout(releaseTimer);if(ready)play().catch(e=>status('再生エラー：'+e.message,true))}
function noteOff(){clearTimeout(releaseTimer);releaseTimer=setTimeout(()=>{if(!manual)pause()},RELEASE_DELAY)}
function onMidi(event){const d=event.data;if(!d||d.length<2)return;const kind=d[0]&0xf0; if(kind===0x90&&d[2]>0){log('note_on '+d[1]);noteOn()}else if(kind===0x80||(kind===0x90&&d[2]===0)){log('note_off '+d[1]);noteOff()}else if(kind===0xb0&&d[1]===90){update(d[2]);log('CC90 '+d[2])}}
function bindInputs(){if(!midi)return;const inputs=[...midi.inputs.values()];for(const input of inputs)input.onmidimessage=onMidi;log('MIDI入力: '+(inputs.map(x=>x.name).join(', ')||'見つかりません'));return inputs.length}
async function init(){let b=$('start');b.disabled=true;try{status('7つのWAV音源を読み込んでいます…');ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let responses=await Promise.all(FILES.map(f=>fetch('./'+f)));for(let i=0;i<responses.length;i++)if(!responses[i].ok)throw Error(FILES[i]+' が見つかりません（HTTP '+responses[i].status+'）');buffers=await Promise.all(responses.map(async r=>ctx.decodeAudioData(await r.arrayBuffer())));let durations=buffers.map(b=>b.duration);if(Math.max(...durations)-Math.min(...durations)>.1)log('注意：7音源の長さが異なります');if(!navigator.requestMIDIAccess)throw Error('このブラウザはWeb MIDI非対応です。MIDI対応ブラウザで開いてください');midi=await navigator.requestMIDIAccess({sysex:false});midi.onstatechange=()=>bindInputs();let count=bindInputs();ready=true;$('manual').disabled=false;$('stop').disabled=false;status(count?'準備OK！TouchMeに触れてください 🎶':'音源読み込みOK。ただしMIDI入力がありません。TouchMeをつなぎ直してください');$('start').textContent='読み込み完了';}catch(e){status('準備できませんでした：'+e.message,true);log('ERROR '+e.message);b.disabled=false}}
$('start').addEventListener('click',init);
$('manual').addEventListener('click',async()=>{manual=!manual;if(manual){await play();$('manual').textContent='手動再生を一時停止'}else{await pause();$('manual').textContent='音を確認する（手動再生）'}});
$('stop').addEventListener('click',async()=>{clearTimeout(releaseTimer);if(ctx){await ctx.resume();sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];gains=[];everStarted=false;playing=false;manual=false;await ctx.suspend();$('manual').textContent='音を確認する（手動再生）';status('停止しました。触れると最初から再生します')}});
</script></body></html>
