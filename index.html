<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TouchMe 接続テスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#31423c;background:#f7f5f0}body{margin:0;padding:32px 18px}main{max-width:480px;margin:auto}h1{font-size:25px;text-align:center}p{line-height:1.65}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 14px #0000000b}button{width:100%;padding:16px;border:0;border-radius:12px;background:#6b9b89;color:white;font-weight:700;font-size:17px}.num{font-size:64px;font-weight:700;text-align:center;margin:10px}.sub{text-align:center;color:#697e74}progress{width:100%;height:20px;accent-color:#6b9b89}#log{white-space:pre-wrap;font:12px/1.6 monospace;max-height:200px;overflow:auto;color:#52665c}small{color:#697e74}
</style></head><body><main><h1>🎵 TouchMe 接続テスト</h1><p>iPhoneのMIDI対応ブラウザで開いて、TouchMeをUSB-Cで接続してね。</p><div class="card"><button id="start">MIDI接続を開始</button><p id="status">接続待ち</p><p id="devices">MIDI入力：未確認</p></div><div class="card"><div class="sub">CC90 の値</div><div class="num" id="value">--</div><progress id="meter" max="127" value="0"></progress><p class="sub" id="stage">触れると変化するよ</p></div><div class="card"><strong>受信ログ</strong><div id="log">まだメッセージはありません。</div></div><small>※ このページは音楽再生前の動作確認用。MIDI対応ブラウザでの利用を想定しています。</small></main>
<script>
const $=id=>document.getElementById(id);let access=null;let count=0;
function log(s){const d=new Date().toLocaleTimeString();$('log').textContent=(++count===1?'':$('log').textContent+'\n')+`[${d}] ${s}`;$('log').scrollTop=$('log').scrollHeight;}
function handle(e){const [status,a,b]=e.data;const type=status&0xf0;if(type===0xb0&&a===90){$('value').textContent=b;$('meter').value=b;const p=Math.max(0,Math.min(1,(b-14)/26));const stages=['① 曖昧','② 断片','③ 予兆','④ リズム','⑤ メロディ','⑥ 曲が分かる','⑦ 完成'];const ix=p<.15?0:p<.30?1:p<.45?2:p<.58?3:p<.72?4:p<.88?5:6;$('stage').textContent=stages[ix];log(`CC90 = ${b}`);}else if(type===0x90||type===0x80){log(`${type===0x90&&b>0?'note_on':'note_off'} note=${a} velocity=${b??0}`);}else{log('MIDI: '+Array.from(e.data).join(', '));}}
function connectInputs(){if(!access)return;const inputs=[...access.inputs.values()];$('devices').textContent=inputs.length?'MIDI入力：'+inputs.map(x=>x.name||'(名称なし)').join(' / '):'MIDI入力が見つかりません';inputs.forEach(input=>input.onmidimessage=handle);$('status').textContent=inputs.length?'接続完了！ TouchMeに触れてみてね':'MIDIアクセス成功・入力機器なし';}
$('start').onclick=async()=>{if(!navigator.requestMIDIAccess){$('status').textContent='このブラウザはWeb MIDI APIに対応していません。MIDI対応ブラウザで開いてね。';return;}try{access=await navigator.requestMIDIAccess({sysex:false});access.onstatechange=connectInputs;connectInputs();}catch(e){$('status').textContent='MIDI接続エラー：'+e.message;}};
</script></body></html>
